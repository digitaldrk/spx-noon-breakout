# One private background worker. No web service, no port, no health check,
# no public URL. Starter, because a free worker sleeps and would miss 11:45 ET.
# The disk at /data holds config.json, state/, logs/, and reports/, so a
# restart mid-day still sees today's open position. See RENDER.md.
#
# Plain variable names, no bot prefix: every bot is configured the same way on
# Render. The Mac launchers keep their own SPX_NOON_HOME.
services:
  - type: worker
    name: spx-noon
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m spx_noon.service
    # A push to the repo's default branch deploys only after the GitHub checks
    # pass. A red `test` or `docker` check leaves the running worker alone.
    autoDeployTrigger: checksPass
    disk:
      name: spx-noon-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # The mounted disk, not the Unix HOME. config, state, logs, reports.
      - key: DATA
        value: /data
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BROKER
        value: tasty
      # live is the mode that transmits; dry and alerts never send.
      - key: MODE
        value: live
      # Real quotes, sandbox orders. Real money needs BOTH of the next two at
      # production and MODE=live, then a redeploy. Production orders on sandbox
      # data refuse to start.
      - key: TASTY_DATA
        value: production
      - key: TASTY_ORDERS
        value: sandbox
      # Pasted in the dashboard, never in the repo, the image, or a log line.
      # Blank means the first account on the order session.
      - key: BROKER_ACCOUNT
        sync: false
      - key: TASTYTRADE_PROD_CLIENT_SECRET
        sync: false
      - key: TASTYTRADE_PROD_REFRESH_TOKEN
        sync: false
      - key: TASTYTRADE_SANDBOX_CLIENT_SECRET
        sync: false
      - key: TASTYTRADE_SANDBOX_REFRESH_TOKEN
        sync: false
      # The whole Google service-account json for the one row the 16:20 wrap
      # upserts on the shared sheet. Pasted in the dashboard, inherited by the
      # wrap child, never in the repo or in /data/config.json. Not one of the
      # six worker settings. Unset means the wrap records that the sheet was
      # not updated and still exits 0.
      - key: SPX_SHEETS_CREDENTIALS_JSON
        sync: false
